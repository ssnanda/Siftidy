name: Build and publish Siftidy

on:
  push:
    branches: [main]
    paths-ignore:
      - altstore.json
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siftidy-publish-main
  cancel-in-progress: false

jobs:
  release:
    name: iOS IPA + universal macOS Release
    runs-on: macos-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Choose release version
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(sed -nE 's/^version: ([0-9]+)\.([0-9]+)\.[0-9]+.*/\1.\2/p' pubspec.yaml)
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]] || { echo 'Invalid pubspec version'; exit 1; }
          echo "RELEASE_VERSION=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Generate Apple runners and permissions
        run: ./scripts/bootstrap_apple.sh
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build unsigned iOS device app
        shell: bash
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER"
      - name: Build universal macOS release
        shell: bash
        run: |
          flutter build macos --release \
            --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER"
      - name: Package iOS IPA and macOS ZIP/DMG
        run: ./scripts/package_release.sh
      - name: Publish all three packages to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; uploading freshly built assets."
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" --title "Siftidy $RELEASE_VERSION" --latest \
              --notes "Automatic v$RELEASE_VERSION build of main.\n\n- iOS IPA: unsigned; AltStore Classic signs it during sideloading.\n- macOS ZIP and DMG: universal arm64 + x86_64; not Developer ID signed/notarized.\n- Review app permissions and back up irreplaceable photos before testing deletion."
          fi
          gh release view "$RELEASE_TAG" --json url,assets --jq '{url,assets:[.assets[].name]}'
      - name: Update AltStore source for published IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_altstore.py "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          git add altstore.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): update AltStore for $RELEASE_TAG [skip ci]"
            git push origin HEAD:main
          fi
      - name: Prune completed old workflow runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_workflows.py --days 7 --keep 5
      - name: Always remove temporary build directories
        if: always()
        shell: bash
        run: rm -rf build dist .dart_tool ios macos
