name: Prune old Actions runs
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old completed runs, keep five per workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_workflows.py --days 7 --keep 5
