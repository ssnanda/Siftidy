name: Validate Siftidy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-and-tests:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Cleanup temporary checkout artifacts
        if: always()
        run: rm -rf build artifacts .dart_tool

  apple-build:
    name: Unsigned Apple compilation
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Apple runners and Photos entitlements
        run: ./scripts/bootstrap_apple.sh
      - name: Check iOS simulator compilation
        run: flutter build ios --simulator --debug --no-codesign
      - name: Check macOS compilation
        run: flutter build macos --debug
      - name: Package Apple simulator and macOS builds
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app artifacts/siftidy-ios-simulator-debug.zip
          find build/macos/Build/Products/Debug -maxdepth 1 -name '*.app' -print -quit | while read -r app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/siftidy-macos-debug.zip
          done
      - name: Upload short-lived debug builds
        uses: actions/upload-artifact@v4
        with:
          name: siftidy-apple-debug-builds
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Delete previous Siftidy debug artifacts
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "siftidy-apple-debug-builds") | [.id, .workflow_run.id] | @tsv' |
          while IFS=$'\t' read -r artifact_id origin_run; do
            if [[ "$origin_run" != "$GITHUB_RUN_ID" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done
      - name: Cleanup working directories
        if: always()
        run: rm -rf build artifacts .dart_tool ios macos
