name: siftidy
description: Privacy-first Apple Photos organization for macOS.
publish_to: none
version: 0.3.15+14

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  image: ^4.5.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
